[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.23.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/collide2954/schematic"

[profile.release]
lto = "fat"
codegen-units = 1

[profile.web]
inherits = "release"
opt-level = "s"
panic = "abort"
strip = true

[patch.crates-io]
cosmic-text = { git = "https://github.com/collide2954/cosmic-text", rev = "38e6578f9a533b1889b033266421ba946b6a8c38" }
