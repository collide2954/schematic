<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.url == "/" %}Schematic: a small Lisp for data{% else %}{{ page.title }} · Schematic{% endif %}</title>
<meta name="description" content="{{ page.description | default: site.description }}">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
<script>try { var t = localStorage.getItem("theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}</script>
</head>
<body>
<header class="top">
  <a class="brand" href="./">Schematic</a>
  <nav>
    <a href="guide.html">Guide</a>
    <a href="reference.html">Reference</a>
    <a href="https://github.com/collide2954/schematic">GitHub</a>
    <button class="theme-toggle" type="button" aria-label="Switch between light and dark"><span class="sun">☀</span><span class="moon">☾</span></button>
  </nav>
</header>
<main class="{{ page.class | default: 'prose' }}">
{{ content }}
{% if page.url == "/guide.html" %}<p class="pager"><a href="reference.html">Next: the reference →</a></p>{% endif %}
{% if page.url == "/reference.html" %}<p class="pager"><a href="guide.html">← Back to the guide</a></p>{% endif %}
</main>
<footer>
  <span>Apache-2.0</span>
  <a href="https://github.com/collide2954/schematic">Source on GitHub</a>
</footer>
<script src="site.js" defer></script>
{% if page.play %}<script src="play.js" defer></script>{% endif %}
</body>
</html>
